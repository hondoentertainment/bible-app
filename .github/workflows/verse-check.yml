name: Verse resolution check

# Verifies that every curated topic verse still resolves against API.Bible.
# Runs weekly (and on demand) rather than per-PR to avoid rate limits.
on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  verses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check verse resolution
        env:
          RUN_LIVE_API: '1'
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
        run: npm run test:verses
